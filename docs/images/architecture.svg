<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">The deployer registers, configures and installs policy on gateways through the Smart-1 Cloud Management API, and configures each Spark appliance through its local REST API. The appliance connects to Smart-1 Cloud over the MaaS tunnel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="deployer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F472B6"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
      .zone { fill: #0F1A30; stroke: #2B3A5E; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .zone-label { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #94A3B8; }
      .box { fill: #16213A; stroke: #2B3A5E; stroke-width: 1.5; }
      .box-title { font-size: 19px; font-weight: 700; fill: #F8FAFC; }
      .box-sub { font-size: 13px; fill: #94A3B8; }
      .code { font-size: 13px; fill: #7DD3FC; }
      .note { font-size: 12px; fill: #64748B; }
      .call { fill: none; stroke: #38BDF8; stroke-width: 2.5; }
      .tunnel { fill: none; stroke: #F472B6; stroke-width: 2.5; stroke-dasharray: 8 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      .pill { fill: #38BDF8; }
      .pill-text { font-size: 12px; font-weight: 700; fill: #0B1220; }
      .label { font-size: 14px; font-weight: 600; fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="20" fill="none" stroke="#2B3A5E"/>

  <g class="sans">
    <!-- Zones -->
    <rect x="380" y="36" width="420" height="320" rx="16" class="zone"/>
    <text x="404" y="66" class="zone-label">CHECK POINT SMART-1 CLOUD</text>
    <rect x="880" y="36" width="290" height="320" rx="16" class="zone"/>
    <text x="904" y="66" class="zone-label">CUSTOMER SITE</text>

    <!-- Deployer -->
    <rect x="40" y="120" width="250" height="150" rx="14" fill="url(#deployer)" stroke="#3B82F6" stroke-width="1.5"/>
    <g transform="translate(64 144)">
      <rect width="34" height="34" rx="8" fill="#0B1220" stroke="#3B82F6"/>
      <path d="M9 12 l6 5 l-6 5 M18 23 h8" fill="none" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="64" y="212" class="box-title">Deployer</text>
    <text x="64" y="236" class="mono code">s1c_deploy_sparks_gw.py</text>
    <text x="64" y="256" class="box-sub">Python 3.9+</text>

    <!-- Management API -->
    <rect x="410" y="86" width="360" height="248" rx="14" class="box"/>
    <text x="434" y="122" class="box-title">Management API</text>
    <text x="434" y="146" class="box-sub">Registers, configures, checks SIC, installs policy</text>
    <text x="434" y="182" class="mono code">add-simple-gateway</text>
    <text x="434" y="200" class="note">Spark hardware, cloud_token, auto-generate-ip</text>
    <text x="434" y="226" class="mono code">set-simple-gateway</text>
    <text x="434" y="244" class="note">one-time password, when_gateway_connects</text>
    <text x="434" y="270" class="mono code">publish, test-sic-status</text>
    <text x="434" y="296" class="mono code">install-policy</text>
    <text x="434" y="318" class="note">Management API 2.1 (Smart-1 Cloud R82.20)</text>

    <!-- Spark appliance -->
    <rect x="904" y="110" width="242" height="190" rx="14" class="box"/>
    <g transform="translate(928 130)">
      <rect width="44" height="26" rx="5" fill="#0B1220" stroke="#2B3A5E"/>
      <circle cx="10" cy="13" r="3" fill="#34D399"/>
      <circle cx="21" cy="13" r="3" fill="#34D399"/>
      <circle cx="32" cy="13" r="3" fill="#FBBF24"/>
    </g>
    <text x="928" y="184" class="box-title">Spark appliance</text>
    <text x="928" y="208" class="box-sub">Local REST API, port 4434</text>
    <text x="928" y="240" class="mono code">connect maas auth-token</text>
    <text x="928" y="262" class="mono code">fetch certificate</text>

    <!-- Calls -->
    <path class="call" d="M290 195 H404" marker-end="url(#arrow)"/>
    <rect x="298" y="167" width="98" height="24" rx="12" class="pill"/>
    <text x="347" y="184" text-anchor="middle" class="pill-text">Phase 1, 3</text>

    <path class="call" d="M165 270 V400 H1025 V306" marker-end="url(#arrow)"/>
    <rect x="540" y="386" width="440" height="30" rx="15" fill="#0F1A30" stroke="#2B3A5E"/>
    <rect x="550" y="390" width="74" height="22" rx="11" class="pill"/>
    <text x="587" y="406" text-anchor="middle" class="pill-text">Phase 2</text>
    <text x="636" y="406" class="label">Configure appliance: cloud token, SIC</text>

    <!-- Tunnel -->
    <path class="tunnel" d="M898 205 H776" marker-end="url(#arrow-pink)" marker-start="url(#arrow-pink)"/>
    <text x="837" y="190" text-anchor="middle" class="label" fill="#F9A8D4">MaaS</text>
  </g>
</svg>

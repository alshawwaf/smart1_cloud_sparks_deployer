<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">SIC configuration on Smart-1 Cloud R82.20</title>
  <desc id="desc">Earlier versions set the one-time password before the object was a Spark gateway, so R82.20 pushed the certificate and SIC failed. The current version converts the object first and sets SIC with initiation-phase when_gateway_connects, so the appliance pulls its certificate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
      .panel { fill: #111A2E; stroke: #2B3A5E; stroke-width: 1.5; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .head { font-size: 21px; font-weight: 700; fill: #F8FAFC; }
      .call { fill: #16213A; stroke: #2B3A5E; stroke-width: 1.5; }
      .cmd { font-size: 15px; font-weight: 600; fill: #7DD3FC; }
      .args { font-size: 13px; fill: #CBD5E1; }
      .hl-bad { font-size: 13px; font-weight: 700; fill: #FCA5A5; }
      .hl-good { font-size: 13px; font-weight: 700; fill: #6EE7B7; }
      .num { font-size: 12px; font-weight: 700; fill: #0B1220; }
      .chev { fill: none; stroke: #64748B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .result { font-size: 15px; font-weight: 600; }
      .sub { font-size: 13px; fill: #94A3B8; }
    </style>
    <clipPath id="left"><rect x="30" y="30" width="555" height="400" rx="14"/></clipPath>
    <clipPath id="right"><rect x="615" y="30" width="555" height="400" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="460" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="20" fill="none" stroke="#2B3A5E"/>

  <g class="sans">
    <!-- Before -->
    <rect x="30" y="30" width="555" height="400" rx="14" class="panel"/>
    <rect x="30" y="30" width="555" height="4" fill="#F87171" clip-path="url(#left)"/>
    <text x="56" y="66" class="label" fill="#F87171">EARLIER VERSIONS</text>
    <text x="56" y="94" class="head">SIC is set before the object is a Spark gateway</text>

    <rect x="56" y="118" width="503" height="82" rx="10" class="call" stroke="#7F1D1D"/>
    <circle cx="80" cy="142" r="11" fill="#94A3B8"/><text x="80" y="146" text-anchor="middle" class="num">1</text>
    <text x="100" y="147" class="mono cmd">set-simple-gateway</text>
    <text x="100" y="178" class="mono args">version, os-name, <tspan class="hl-bad">one-time-password</tspan>, sic-name</text>

    <path d="M299 208 l8 8 l8 -8" class="chev"/>

    <rect x="56" y="228" width="503" height="56" rx="10" class="call"/>
    <circle cx="80" cy="256" r="11" fill="#94A3B8"/><text x="80" y="260" text-anchor="middle" class="num">2</text>
    <text x="100" y="261" class="mono cmd">set-generic-object</text>
    <text x="290" y="261" class="args">convert to Spark gateway</text>

    <path d="M299 292 l8 8 l8 -8" class="chev"/>

    <rect x="56" y="312" width="503" height="92" rx="10" fill="#2A1218" stroke="#7F1D1D" stroke-width="1.5"/>
    <circle cx="84" cy="340" r="14" fill="#F87171"/>
    <path d="M78 334 l12 12 M90 334 l-12 12" stroke="#2A1218" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="346" class="result" fill="#FCA5A5">SIC fails on R82.20</text>
    <text x="110" y="370" class="sub">The object is not a Spark gateway yet, so the management</text>
    <text x="110" y="390" class="sub">server pushes the certificate to an unreachable appliance.</text>

    <!-- After -->
    <rect x="615" y="30" width="555" height="400" rx="14" class="panel"/>
    <rect x="615" y="30" width="555" height="4" fill="#34D399" clip-path="url(#right)"/>
    <text x="641" y="66" class="label" fill="#34D399">CURRENT VERSION</text>
    <text x="641" y="94" class="head">The appliance pulls its certificate</text>

    <rect x="641" y="118" width="503" height="56" rx="10" class="call"/>
    <circle cx="665" cy="146" r="11" fill="#94A3B8"/><text x="665" y="150" text-anchor="middle" class="num">1</text>
    <text x="685" y="151" class="mono cmd">set-simple-gateway</text>
    <text x="875" y="151" class="mono args">version, os-name</text>

    <path d="M884 179 l8 8 l8 -8" class="chev"/>

    <rect x="641" y="196" width="503" height="56" rx="10" class="call"/>
    <circle cx="665" cy="224" r="11" fill="#94A3B8"/><text x="665" y="228" text-anchor="middle" class="num">2</text>
    <text x="685" y="229" class="mono cmd">set-generic-object</text>
    <text x="875" y="229" class="args">convert to Spark gateway</text>

    <path d="M884 257 l8 8 l8 -8" class="chev"/>

    <rect x="641" y="274" width="503" height="76" rx="10" class="call" stroke="#065F46"/>
    <circle cx="665" cy="298" r="11" fill="#94A3B8"/><text x="665" y="302" text-anchor="middle" class="num">3</text>
    <text x="685" y="303" class="mono cmd">set-simple-gateway</text>
    <text x="875" y="303" class="mono args">one-time-password, sic-name</text>
    <text x="685" y="331" class="mono hl-good">trust-settings.initiation-phase: when_gateway_connects</text>

    <rect x="641" y="362" width="503" height="42" rx="10" fill="#0E2A22" stroke="#065F46" stroke-width="1.5"/>
    <circle cx="667" cy="383" r="12" fill="#34D399"/>
    <path d="M661 383 l4 4 l8 -8" fill="none" stroke="#0E2A22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="690" y="388" class="result" fill="#6EE7B7">SIC completes when the appliance runs fetch certificate</text>
  </g>
</svg>

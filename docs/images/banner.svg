<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Smart-1 Cloud Spark Gateway Deployer</title>
  <desc id="desc">Automated onboarding of Quantum Spark gateways to Check Point Smart-1 Cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#111C33"/>
      <stop offset="1" stop-color="#1A1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6007E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E6007E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3EA5"/>
      <stop offset="1" stop-color="#B0006A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6007E"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="20"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 3px; fill: #94A3B8; }
      .title { font-size: 54px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 20px; fill: #CBD5E1; }
      .pill { font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .node-label { font-size: 12px; font-weight: 600; fill: #CBD5E1; }
      .hub-label { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .link { stroke: #38BDF8; stroke-opacity: 0.55; stroke-width: 2; stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <circle cx="1010" cy="170" r="230" fill="url(#glow)"/>

    <!-- Network illustration -->
    <g fill="none">
      <path class="link" d="M1010 170 L842 76"/>
      <path class="link" d="M1010 170 L828 196"/>
      <path class="link" d="M1010 170 L878 286"/>
      <path class="link" d="M1010 170 L1170 70"/>
      <path class="link" d="M1010 170 L1190 200"/>
      <path class="link" d="M1010 170 L1132 292"/>
    </g>
    <g class="sans">
      <g transform="translate(796 58)">
        <rect width="92" height="36" rx="8" fill="#16213A" stroke="#2B3A5E"/>
        <circle cx="14" cy="18" r="4" fill="#34D399"/>
        <text x="26" y="22" class="node-label">Spark</text>
      </g>
      <g transform="translate(782 178)">
        <rect width="92" height="36" rx="8" fill="#16213A" stroke="#2B3A5E"/>
        <circle cx="14" cy="18" r="4" fill="#34D399"/>
        <text x="26" y="22" class="node-label">Spark</text>
      </g>
      <g transform="translate(832 268)">
        <rect width="92" height="36" rx="8" fill="#16213A" stroke="#2B3A5E"/>
        <circle cx="14" cy="18" r="4" fill="#34D399"/>
        <text x="26" y="22" class="node-label">Spark</text>
      </g>
      <g transform="translate(1124 52)">
        <rect width="92" height="36" rx="8" fill="#16213A" stroke="#2B3A5E"/>
        <circle cx="14" cy="18" r="4" fill="#34D399"/>
        <text x="26" y="22" class="node-label">Spark</text>
      </g>
      <g transform="translate(1144 182)">
        <rect width="92" height="36" rx="8" fill="#16213A" stroke="#2B3A5E"/>
        <circle cx="14" cy="18" r="4" fill="#FBBF24"/>
        <text x="26" y="22" class="node-label">Spark</text>
      </g>
      <g transform="translate(1086 274)">
        <rect width="92" height="36" rx="8" fill="#16213A" stroke="#2B3A5E"/>
        <circle cx="14" cy="18" r="4" fill="#34D399"/>
        <text x="26" y="22" class="node-label">Spark</text>
      </g>

      <!-- Hub -->
      <circle cx="1010" cy="170" r="62" fill="#E6007E" fill-opacity="0.12"/>
      <circle cx="1010" cy="170" r="46" fill="url(#hub)"/>
      <path d="M990 172 a12 12 0 0 1 4-23 a16 16 0 0 1 30 4 a10 10 0 0 1 2 19 z" fill="#FFFFFF" fill-opacity="0.95"/>
      <text x="1010" y="200" text-anchor="middle" class="hub-label">S1C</text>
    </g>

    <!-- Text block -->
    <g class="sans">
      <text x="72" y="92" class="eyebrow">CHECK POINT  ·  SMART-1 CLOUD  ·  QUANTUM SPARK</text>
      <rect x="72" y="108" width="72" height="4" rx="2" fill="url(#accent)"/>
      <text x="72" y="172" class="title">Smart-1 Cloud Spark</text>
      <text x="72" y="232" class="title">Gateway Deployer</text>
      <text x="72" y="270" class="subtitle">Automated onboarding of Quantum Spark gateways to Smart-1 Cloud</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="20" fill="none" stroke="#2B3A5E"/>
</svg>
